name: Build & Release
description: Builds, vets, and tests SchopYatch, while creating a release if applicable.

on: 
  push:
    branches-ignore:
      - master
  workflow_dispatch:
  workflow_call:
    outputs:
      version:
        description: SchopYatch version
        value: ${{ jobs.build-and-release.outputs.version }}

jobs:
  build-and-release:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ env.VERSION }}
    steps:
    - name: Compile DAVE
      run: |
        set -euo pipefail

        mkdir -p ~/.local
        curl -fL --retry 5 --retry-delay 2 \
          "https://github.com/discord/libdave/releases/download/v1.1.1%2Fcpp/libdave-Linux-X64-boringssl.zip" \
          -o ~/.local/prebuilt.zip

        # Confirm the expected files exist in the archive (and show listing for debugging)
        unzip -l ~/.local/prebuilt.zip | sed -n '1,200p'

        mkdir -p ~/.local/lib ~/.local/include

        # Extract by matching actual filenames (in case the archive layout differs)
        unzip -j -o ~/.local/prebuilt.zip "*/dave.h" -d ~/.local/include
        unzip -j -o ~/.local/prebuilt.zip "*/libdave.so" -d ~/.local/lib

        rm -f ~/.local/prebuilt.zip

        mkdir -p ~/.local/lib/pkgconfig
        cat > ~/.local/lib/pkgconfig/dave.pc <<'EOF'
        prefix=${HOME}/.local
        exec_prefix=${prefix}
        libdir=${exec_prefix}/lib
        includedir=${prefix}/include

        Name: dave
        Description: Discord Audio & Video End-to-End Encryption (DAVE) Protocol
        Version: v1.1.1
        URL: https://github.com/discord/libdave
        Libs: -L${libdir} -ldave -Wl,-rpath,${libdir}
        Cflags: -I${includedir}
        EOF

        cd ~/.local
        ls -la
        cd lib
        ls -la
        cd pkgconfig
        cat dave.pc

    - name: Checkout SchopYatch
      uses: actions/checkout@v6.0.2

    - name: Set up Go
      uses: actions/setup-go@v6.4.0
      with:
        go-version-file: "go.mod"

    - name: Vet
      run: go vet -v ./...

    - name: Test
      run: go test -v ./...

    - name: Build
      run: |
        export PKG_CONFIG_PATH=~/.local/lib/pkgconfig
        go build -o schopyatch_linux64 -v .

    - name: Get Version
      if: ${{ github.ref_name == 'master' }}
      run: echo "VERSION=$(cat version.txt)" >> $GITHUB_ENV

    - name: Create Release
      if: ${{ github.ref_name == 'master' }}
      uses: ncipollo/release-action@v1.21.0
      with:
          commit: "master"
          tag: ${{ env.VERSION }}
          artifacts: "schopyatch_linux64"
          generateReleaseNotes: false
          makeLatest: true
          skipIfReleaseExists: true
