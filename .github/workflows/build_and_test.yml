name: Build, Vet & Test

on: 
  pull_request:
    branches:
      - master
  push:
    branches-ignore:
      - master
  workflow_dispatch:

jobs:
  build-vet-and-test:
    name: Build, Vet & Test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout SchopYatch
      uses: actions/checkout@v6.0.2

    - name: Compile DAVE
      run: |
        curl -fsL https://github.com/discord/libdave/releases/download/v1.1.1%2Fcpp/libdave-Linux-X64-boringssl.zip -o ~/libdave/prebuilt.zip
        mkdir -p ~/libdave/lib ~/libdave/include
        unzip -j -o ~/libdave/prebuilt.zip "include/dave/dave.h" -d ~/libdave/include
        unzip -j -o ~/libdave/prebuilt.zip "lib/libdave.so" -d ~/libdave/lib
        rm -f ~/libdave/prebuilt.zip
        mkdir -p ~/libdave/lib/pkgconfig
        cat <<EOF > ~/libdave/lib/pkgconfig/dave.pc
        prefix=~/libdave
        exec_prefix=\${prefix}
        libdir=\${exec_prefix}/lib
        includedir=\${prefix}/include

        Name: dave
        Description: Discord Audio & Video End-to-End Encryption (DAVE) Protocol
        Version: v1.1.1
        URL: https://github.com/discord/libdave
        Libs: -L\${libdir} -ldave -Wl,-rpath,\${libdir}
        Cflags: -I\${includedir}
        EOF

    - name: Set up Go
      uses: actions/setup-go@v6.4.0
      with:
        go-version-file: "go.mod"

    - name: Build
      run: |
        echo "PKG_CONFIG_PATH=~/libdave/lib/pkgconfig" >> $GITHUB_ENV
        go build .

    - name: Vet
      run: go vet -v ./...

    - name: Test
      run: go test -v ./...
