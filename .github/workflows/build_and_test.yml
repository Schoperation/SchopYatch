name: Build, Vet & Test

on: 
  pull_request:
    branches:
      - master
  push:
    branches-ignore:
      - master
  workflow_dispatch:
  workflow_call:

jobs:
  build-vet-and-test:
    name: Build, Vet & Test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout SchopYatch
      uses: actions/checkout@v6.0.2

    - name: Compile DAVE
      run: |
        set -euo pipefail

        mkdir -p ~/libdave
        curl -fL --retry 5 --retry-delay 2 \
          "https://github.com/discord/libdave/releases/download/v1.1.1%2Fcpp/libdave-Linux-X64-boringssl.zip" \
          -o ~/libdave/prebuilt.zip

        # Confirm the expected files exist in the archive (and show listing for debugging)
        unzip -l ~/libdave/prebuilt.zip | sed -n '1,200p'

        mkdir -p ~/libdave/lib ~/libdave/include

        # Extract by matching actual filenames (in case the archive layout differs)
        unzip -j -o ~/libdave/prebuilt.zip "*/dave.h" -d ~/libdave/include
        unzip -j -o ~/libdave/prebuilt.zip "*/libdave.so" -d ~/libdave/lib

        rm -f ~/libdave/prebuilt.zip

        mkdir -p ~/libdave/lib/pkgconfig
        cat > ~/libdave/lib/pkgconfig/dave.pc <<'EOF'
        prefix=/home/runner/libdave
        exec_prefix=${prefix}
        libdir=${exec_prefix}/lib
        includedir=${prefix}/include

        Name: dave
        Description: Discord Audio & Video End-to-End Encryption (DAVE) Protocol
        Version: v1.1.1
        URL: https://github.com/discord/libdave
        Libs: -L${libdir} -ldave -Wl,-rpath,${libdir}
        Cflags: -I${includedir}
        EOF

    - name: Set up Go
      uses: actions/setup-go@v6.4.0
      with:
        go-version-file: "go.mod"

    - name: Build
      run: |
        export PKG_CONFIG_PATH=/home/runner/libdave/lib/pkgconfig
        go build .

    - name: Vet
      run: go vet -v ./...

    - name: Test
      run: go test -v ./...
