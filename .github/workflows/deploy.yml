name: Deploy SchopYatch
description: Builds & releases the latest SchopYatch if needed, and deploys it to the production environment.

on: 
  push: 
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-release:
    name: Check Build & Release
    permissions:
      contents: write
    uses: Schoperation/SchopYatch/.github/workflows/build-and-release.yml@master
  deploy:
    name: Deploy To Server
    runs-on: ubuntu-latest
    needs: build-and-release
    steps:
      - name: Deploy Via SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          VERSION: ${{ needs.build-and-release.outputs.version }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: VERSION
          script: |
            cd ~/SchopYatch
            rm schopyatch
            pkill schopyatch
            wget "https://github.com/Schoperation/SchopYatch/releases/tag/$VERSION/schopyatch_linux64"
            mv schopyatch_linux64 schopyatch
            cp schopyatch ../../schopyatch_bot/
            cd ../../schopyatch_bot
            ./schopyatch &>logs/schopyatch.log &
